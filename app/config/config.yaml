# path: app/config/config.yaml
app:
  name: "NexusMind"
  bot_name: "Nexa"
  description: "Nexa is a unified assistant for generic chat and AI/ML research."

server:
  host: "${API_HOST}"
  port: ${API_PORT}
  log_level: "${LOG_LEVEL}"

frontend:
  host: "${FRONTEND_HOST}"
  port: ${FRONTEND_PORT}

llm:
  default_tier: 0
  default_model_id: "auto"

  providers:
    ollama:
      enabled: true
      base_url: "${OLLAMA_BASE_URL}"
      primary_model: "qwen2.5-coder:3b-instruct"
      planner_model: "qwen2.5-coder:3b-instruct"
      small_reasoning_model: "qwen2.5-coder:3b-instruct"

    gemini:
      enabled: true
      model: "gemini-2.5-flash"

    openai:
      enabled: false
      default_model: "gpt-5.4-mini"

    anthropic:
      enabled: false
      default_model: "claude-sonnet-4.6"

  available_models:
    - id: "auto"
      label: "Auto"
      provider: "router"
      mode: "auto"
      tier: "auto"
      enabled: true
      status: "active"
      capabilities: ["chat", "rag", "search", "research"]

    - id: "qwen2.5-coder:3b-instruct"
      label: "qwen2.5-coder:3b-instruct"
      provider: "ollama"
      mode: "local"
      tier: 0
      enabled: true
      status: "active"
      capabilities: ["chat", "rag", "research"]

    - id: "gemini-2.5-flash"
      label: "gemini-2.5-flash"
      provider: "gemini"
      mode: "cloud"
      tier: 1
      enabled: true
      status: "active"
      capabilities: ["chat", "search", "research"]

    - id: "gpt-5.4-mini"
      label: "gpt-5.4-mini"
      provider: "openai"
      mode: "cloud"
      tier: 1
      enabled: false
      status: "coming_soon"
      capabilities: ["chat", "search", "research"]

    - id: "claude-sonnet-4.6"
      label: "claude-sonnet-4.6"
      provider: "anthropic"
      mode: "cloud"
      tier: 1
      enabled: false
      status: "coming_soon"
      capabilities: ["chat", "search", "research"]

  routing_rules:
    planner:
      tier: 0
    router:
      tier: 0
    ecommerce_explanation:
      min_tier: 0
      max_tier: 0
      allow_cloud_fallback: false
    research_synthesis:
      min_tier: 0
      max_tier: 1
      allow_cloud_fallback: true
      max_cloud_calls_per_request: 1
    generic_chat:
      min_tier: 0
      max_tier: 0

vectorstores:
  chroma:
    host: "${CHROMA_HOST}"
    port: ${CHROMA_PORT}
    collection_prefix: "nexusmind_"
    upsert_batch_size: 64

  collections:
    chroma_collection: "knowledgebase"
    nexusmind_knowledgebase: "knowledgebase"

research:
  offline_pdf_dir_env: "OFFLINE_PDF_DIR"
  top_k_retrieval: 6
  max_sources_online: 5

rag:
  chunk_size: 800
  chunk_overlap: 200
  embedding_model: "nomic-embed-text"