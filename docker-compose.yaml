services:
  chroma:
    image: chromadb/chroma:latest
    container_name: nexusmind-chromadb

    ports:
      - "8000:8000" # KEEP THIS

    volumes:
      - ./chroma-data:/chroma

    command: >
      run --host 0.0.0.0 --port 8000

    environment:
      IS_PERSISTENT: "TRUE"
      ANONYMIZED_TELEMETRY: "FALSE"

    restart: unless-stopped
